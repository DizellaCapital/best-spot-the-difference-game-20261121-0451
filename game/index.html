<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spot the Difference — 3 Scenes, 7 Differences Each</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #141c2e;
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif;
      }
      #game {
        width: 1280px;
        height: 480px;
        max-width: 100vw;
        max-height: 100vh;
        display: block;
        background: #141c2e;
        cursor: crosshair;
      }
      #status {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="1280" height="480"></canvas>
    <div id="status" role="status" aria-live="polite"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
